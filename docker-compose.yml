version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bloguser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-blogpass}
      POSTGRES_DB: ${DB_NAME:-blogdb}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bloguser}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-simple-blog-backend:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-bloguser}
      DB_PASSWORD: ${DB_PASSWORD:-blogpass}
      DB_NAME: ${DB_NAME:-blogdb}
      PORT: 3000
    expose:
      - "3000"

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-simple-blog-frontend:latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Server-side (getServerSideProps, API routes) calls the backend
      # over the internal Docker network — the browser never sees this.
      BACKEND_INTERNAL_URL: http://backend:3000
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  db-data:
